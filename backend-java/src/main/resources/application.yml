server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: dms-backend
  # Load local, Git-ignored environment values for IDEA/Maven runs as well as Docker Compose.
  # Both paths are optional so packaged and container deployments still rely on real environment variables.
  config:
    import: optional:file:./.env[.properties],optional:file:./backend-java/.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:anshun_ad_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  cache:
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 10m
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-migration-naming: true
  web:
    resources:
      static-locations: classpath:/static/,file:${FRONTEND_DIST:../dms/dist/}

app:
  jwt:
    # Production must override this with a Base64-encoded random secret of at least 32 bytes.
    secret: ${JWT_SECRET:YW5zaHVuLWFkLWRtcy1kZW1vLXNlY3JldC1rZXktMjAyNi0xMjM0NTY=}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  security:
    token-blacklist-enabled: ${TOKEN_BLACKLIST_ENABLED:false}
    token-blacklist-fail-closed: ${TOKEN_BLACKLIST_FAIL_CLOSED:false}
    registration-enabled: ${REGISTRATION_ENABLED:true}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    login-rate-limit:
      redis-enabled: ${LOGIN_RATE_LIMIT_REDIS_ENABLED:true}
      max-per-username-per-minute: ${LOGIN_MAX_PER_USERNAME_PER_MINUTE:6}
      max-per-ip-per-minute: ${LOGIN_MAX_PER_IP_PER_MINUTE:20}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin-change-me}
    bucket: ${MINIO_BUCKET:lease-attachments}
    max-file-size: ${MINIO_MAX_FILE_SIZE:20971520}
  ai:
    # A generated write draft must be confirmed from the UI before this period elapses.
    action-confirmation-ttl-minutes: ${AI_ACTION_CONFIRMATION_TTL_MINUTES:10}
    rate-limit:
      redis-enabled: ${AI_RATE_LIMIT_REDIS_ENABLED:true}
    streaming:
      core-pool-size: ${AI_STREAM_CORE_POOL_SIZE:2}
      max-pool-size: ${AI_STREAM_MAX_POOL_SIZE:8}
      queue-capacity: ${AI_STREAM_QUEUE_CAPACITY:40}
      sse-timeout-ms: ${AI_STREAM_SSE_TIMEOUT_MS:300000}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
      max-requests-per-minute: ${DEEPSEEK_MAX_REQUESTS_PER_MINUTE:12}
      # Enable only when a stale local system proxy prevents the JDK from reaching DeepSeek.
      bypass-system-proxy: ${DEEPSEEK_BYPASS_SYSTEM_PROXY:false}
    embedding:
      # hash keeps documents local for development. Set provider=openai for any OpenAI-compatible embedding endpoint.
      provider: ${AI_EMBEDDING_PROVIDER:hash}
      base-url: ${AI_EMBEDDING_BASE_URL:}
      api-key: ${AI_EMBEDDING_API_KEY:}
      model: ${AI_EMBEDDING_MODEL:local-hash-ngram-v1}
      dimensions: ${AI_EMBEDDING_DIMENSIONS:256}
    vector-store:
      enabled: ${VECTOR_STORE_ENABLED:false}
      base-url: ${QDRANT_BASE_URL:http://127.0.0.1:6333}
      collection: ${QDRANT_COLLECTION:anshun_knowledge}
      dimensions: ${QDRANT_VECTOR_DIMENSIONS:256}

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 20MB

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    redis:
      enabled: ${MANAGEMENT_REDIS_HEALTH_ENABLED:true}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: 安顺户外广告数据管理与智能 Agent 平台
