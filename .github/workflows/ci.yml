name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Require Docker for integration tests
        run: docker info

      - name: Test and package
        run: |
          chmod +x backend-java/mvnw
          backend-java/mvnw -f backend-java/pom.xml --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: dms/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir dms install --frozen-lockfile

      - name: Build Vue application
        run: pnpm --dir dms build:web

      - name: Validate Docker Compose
        run: docker compose -f backend-java/compose.yaml config --quiet
